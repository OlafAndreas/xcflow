name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  macos:
    name: Build for macOS
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check the version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -q "static let current = \"$VERSION\"" Sources/xcflow/Version.swift || { echo "::error::Tag $GITHUB_REF_NAME doesn't match Version.current in Sources/xcflow/Version.swift."; exit 1; }

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Test
        run: swift test

      - name: Build a universal binary
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          swift build -c release --arch arm64 --arch x86_64
          BIN="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/xcflow"
          lipo -archs "$BIN"
          mkdir -p archive dist
          cp "$BIN" LICENSE README.md archive/
          tar -czf "dist/xcflow-$VERSION.tar.gz" -C archive .

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/

  linux:
    name: Build for Linux ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: swift:6.3-jammy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Test
        run: swift test

      - name: Build a binary with the Swift runtime linked in
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          swift build -c release --static-swift-stdlib
          BIN="$(swift build -c release --static-swift-stdlib --show-bin-path)/xcflow"
          "$BIN" --version
          mkdir -p archive dist
          cp "$BIN" LICENSE README.md archive/
          tar -czf "dist/xcflow-$VERSION-linux-${{ matrix.arch }}.tar.gz" -C archive .

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/

  # Every step here can run again after a failure: see the guards before the release create, the action push and the formula commit.
  publish:
    name: Publish the release
    needs: [macos, linux]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download the archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums
        run: |
          cd dist
          sha256sum xcflow-*.tar.gz > checksums.txt
          for ARCHIVE in xcflow-*.tar.gz; do sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"; done
          cat checksums.txt

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME exists already; making sure it has every asset."
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "xcflow ${GITHUB_REF_NAME#v}" --generate-notes
          fi

      - name: Publish the install action
        env:
          ACTION_TOKEN: ${{ secrets.ACTION_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          X86=$(grep "xcflow-$VERSION-linux-x86_64.tar.gz" dist/checksums.txt | cut -d ' ' -f 1)
          ARM=$(grep "xcflow-$VERSION-linux-aarch64.tar.gz" dist/checksums.txt | cut -d ' ' -f 1)
          test -n "$X86" -a -n "$ARM" || { echo "::error::Linux checksums missing from checksums.txt."; exit 1; }
          git clone "https://x-access-token:${ACTION_TOKEN}@github.com/OlafAndreas/xcflow-action.git" action
          if git -C action ls-remote --exit-code --tags origin "v$VERSION" >/dev/null 2>&1; then
            echo "xcflow-action v$VERSION is published already; leaving it as it is."
            exit 0
          fi
          sed -e "s/{{version}}/$VERSION/g" \
              -e "s/{{archive-linux-x86_64}}/xcflow-$VERSION-linux-x86_64.tar.gz/g" -e "s/{{checksum-linux-x86_64}}/$X86/g" \
              -e "s/{{archive-linux-aarch64}}/xcflow-$VERSION-linux-aarch64.tar.gz/g" -e "s/{{checksum-linux-aarch64}}/$ARM/g" \
              Action/action.yml > action/action.yml
          if grep -q "{{" action/action.yml; then echo "::error::A placeholder in action.yml wasn't filled."; exit 1; fi
          cp Action/README.md LICENSE action/
          cd action
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add action.yml README.md LICENSE
          git commit -m "xcflow $VERSION"
          git tag "v$VERSION"
          git push origin HEAD:main "v$VERSION"

      - name: Update the Homebrew formula
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(cut -d ' ' -f 1 "dist/xcflow-$VERSION.tar.gz.sha256")
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/OlafAndreas/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cat > tap/Formula/xcflow.rb <<RUBY
          class Xcflow < Formula
            desc "Xcode Cloud workflows as JSON files in your repo"
            homepage "https://github.com/OlafAndreas/xcflow"
            url "https://github.com/OlafAndreas/xcflow/releases/download/v${VERSION}/xcflow-${VERSION}.tar.gz"
            sha256 "${SHA}"
            license "MIT"

            depends_on macos: :sonoma

            def install
              bin.install "xcflow"
            end

            test do
              assert_equal version.to_s, shell_output("#{bin}/xcflow --version").strip
            end
          end
          RUBY
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/xcflow.rb
          if git diff --cached --quiet; then
            echo "The formula is at $VERSION already."
          else
            git commit -m "xcflow ${VERSION}"
            git push
          fi

  verify:
    name: Verify the release on ${{ matrix.runner }}
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout the install action at this tag
        uses: actions/checkout@v7
        with:
          repository: OlafAndreas/xcflow-action
          ref: refs/tags/${{ github.ref_name }}
          path: action

      - name: Set up a repo with the released xcflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$RUNNER_OS-$RUNNER_ARCH" in
            macOS-*) NAME="xcflow-$VERSION.tar.gz" ;;
            Linux-X64) NAME="xcflow-$VERSION-linux-x86_64.tar.gz" ;;
            Linux-ARM64) NAME="xcflow-$VERSION-linux-aarch64.tar.gz" ;;
          esac
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "$NAME" --dir "$RUNNER_TEMP/bootstrap"
          tar -xzf "$RUNNER_TEMP/bootstrap/$NAME" -C "$RUNNER_TEMP/bootstrap"
          mkdir smoke
          "$RUNNER_TEMP/bootstrap/xcflow" setup --repo smoke --products com.example.app --skip-export --skip-secrets | tee setup.txt
          SHA=$(git -C action rev-parse HEAD)
          for WF in plan apply sync; do
            grep -q "uses: OlafAndreas/xcflow-action@$SHA # v$VERSION" "smoke/.github/workflows/xcflow-$WF.yml" || { echo "::error::xcflow-$WF.yml doesn't pin the published action at $SHA."; exit 1; }
          done
          test -f smoke/.github/dependabot.yml || { echo "::error::setup didn't write .github/dependabot.yml."; exit 1; }
          test ! -e smoke/.github/actions || { echo "::error::setup still wrote .github/actions/."; exit 1; }

      - name: Install xcflow with the published action
        if: runner.os == 'Linux'
        uses: ./action

      # The published action is Linux-only. On macOS, check the archive that Homebrew installs instead.
      - name: Use the macOS archive
        if: runner.os == 'macOS'
        run: echo "$RUNNER_TEMP/bootstrap" >> "$GITHUB_PATH"

      - name: Run xcflow from the install
        run: |
          test "$(xcflow --version)" = "${GITHUB_REF_NAME#v}"
          xcflow plan --root Tests/Fixtures/Smoke/XcodeCloud --dry-run Tests/Fixtures/Smoke/XcodeCloud | tee plan.md
          grep -q "0 to create, 0 to update, 0 to delete, 1 unchanged." plan.md
