name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  macos:
    name: Build and test on macOS
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          swift --version

      - name: Test
        run: swift test

  linux:
    name: Build and test on Linux ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: swift:6.3-noble

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Test
        run: |
          swift --version
          swift test
          echo "Spike: prebuilts:"; find .build/prebuilts -maxdepth 3 2>/dev/null || echo "Spike: no prebuilts directory"
          grep -A3 '"swift-syntax"' Package.resolved
          for f in $(find .build/prebuilts -name '*.json'); do echo "Spike: manifest $f"; cat "$f"; echo; done
          echo "Spike: SwiftParser compiled from source: $(swift build -v 2>&1 >/dev/null; find .build -name 'SwiftParser*.swiftmodule' -path '*debug*' | wc -l)"
