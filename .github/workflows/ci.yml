name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  macos:
    name: Build and test on macOS
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          swift --version

      - name: Test
        run: swift test

  linux:
    name: Build and test on Linux ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: swift:6.3-jammy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Test
        run: |
          swift --version
          swift test
          echo "Spike: prebuilts:"; find .build/prebuilts -maxdepth 3 2>/dev/null || echo "Spike: no prebuilts directory"
          grep -A3 '"swift-syntax"' Package.resolved

      - name: Build the release binary
        run: |
          rm -rf .build/release .build/*-unknown-linux-gnu/release
          START=$(date +%s)
          swift build -c release --static-swift-stdlib
          echo "Spike: static release build took $(( $(date +%s) - START ))s"
          BIN="$(swift build -c release --static-swift-stdlib --show-bin-path)/xcflow"
          "$BIN" --version
          echo "Spike: binary size $(stat -c %s "$BIN") bytes"

      # Spike: a fake key makes the handler's first request come back 401; a missing handler fails before any request.
      - name: Spike - the handler is discovered in the static binary, stripped too
        run: |
          BIN="$(swift build -c release --static-swift-stdlib --show-bin-path)/xcflow"
          strip -o /tmp/xcflow-stripped "$BIN"
          echo "Spike: stripped size $(stat -c %s /tmp/xcflow-stripped) bytes"
          command -v openssl >/dev/null || (apt-get update -qq && apt-get install -y -qq openssl >/dev/null)
          openssl ecparam -name prime256v1 -genkey -noout | openssl pkcs8 -topk8 -nocrypt > /tmp/fake.p8
          export ASC_KEY_ID=FAKEKEY123 ASC_ISSUER_ID=00000000-0000-0000-0000-000000000000 ASC_KEY_CONTENT="$(base64 -w0 /tmp/fake.p8)"
          for B in "$BIN" /tmp/xcflow-stripped; do
            OUT=$("$B" builds --all 2>&1 || true)
            echo "$B: $OUT"
            echo "$OUT" | grep -q "returned 401" || { echo "::error::$B didn't reach the handler."; exit 1; }
          done
