name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  macos:
    name: Build and test on macOS
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          swift --version

      - name: Test
        run: swift test

  linux:
    name: Build and test on Linux
    runs-on: ubuntu-latest
    container: swift:6.3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test
        run: |
          swift --version
          swift test
