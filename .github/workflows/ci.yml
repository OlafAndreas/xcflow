name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  macos:
    name: Build and test on macOS
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          swift --version

      - name: Test
        run: swift test

  linux:
    name: Build and test on Linux ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: swift:6.3-jammy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test
        run: |
          swift --version
          swift test

      - name: Build the release binary
        run: |
          swift build -c release --static-swift-stdlib
          "$(swift build -c release --static-swift-stdlib --show-bin-path)/xcflow" --version
